<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Task Manager{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; padding: 2rem; }
    .card { max-width: 680px; margin: 3rem auto 0; background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    input[type=text], input[type=password] { padding: .6rem; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: .6rem 1rem; border: 0; background: #2563eb; color: #fff; border-radius: 8px; cursor: pointer; font-size: 1rem; }

    /* Add task form: title, priority, date and button in one row, same height */
    .add-form { display: flex; flex-wrap: nowrap; align-items: stretch; gap: .6rem; margin-bottom: 1rem; }
    .add-form input[type=text], .add-form select, .add-form input[type=date] {
      box-sizing: border-box; padding: .7rem .8rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; background: #fff;
    }
    .add-form input[type=text] { flex: 1 1 auto; min-width: 0; }
    .add-form select, .add-form input[type=date] { flex: 0 0 auto; }
    .add-form button { flex: 0 0 auto; padding: 0 1.2rem; }

    /* Login / register form */
    .auth-form { display: flex; flex-direction: column; gap: .7rem; }

    /* Task list */
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: .6rem 0; border-bottom: 1px solid #eee; }
    .done { text-decoration: line-through; color: #999; }
    .actions { white-space: nowrap; }
    .actions form { display: inline; margin: 0; }
    .link-btn { background: none; color: #2563eb; padding: 0; margin-left: .8rem; font-size: 1rem; }
    .link-btn:hover { text-decoration: underline; }
    a.link-btn { text-decoration: none; }

    /* Priority badges and due dates */
    .badge { font-size: .75rem; padding: .15rem .5rem; border-radius: 999px; margin-left: .5rem; }
    .badge-high { background: #fde2e2; color: #b42318; }
    .badge-medium { background: #fff1d6; color: #9a6200; }
    .badge-low { background: #dcf5e4; color: #1a7f45; }
    .due { display: block; color: #666; font-size: .85rem; margin-top: .15rem; }
    .overdue { color: #b42318; font-weight: 600; }

    /* Edit page */
    .edit-form { display: flex; flex-direction: column; gap: .7rem; }
    .edit-form label { font-size: .9rem; color: #555; }
    .edit-form input[type=text], .edit-form input[type=date], .edit-form select { padding: .6rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    .edit-form .buttons { display: flex; gap: 1rem; align-items: center; margin-top: .5rem; }

    /* Messages */
    .flash { background: #fff4d6; border-radius: 8px; padding: .6rem .8rem; margin: 0 0 1rem; }
    .small { color: #666; font-size: .9rem; margin-top: 1rem; }

    /* Top right buttons */
    .topbar { position: fixed; top: 1rem; right: 1.5rem; display: flex; gap: .5rem; }
    .topbar form { margin: 0; }
    .nav-btn { display: inline-block; padding: .5rem 1rem; background: #2563eb; color: #fff; border-radius: 8px; font-size: .9rem; text-decoration: none; }
  </style>
</head>
<body>
  <nav class="topbar">
    <a class="nav-btn" href="{{ url_for('index') }}">Home</a>
    {% if current_user.is_authenticated %}
    <form action="{{ url_for('logout') }}" method="post">
      <button class="nav-btn" type="submit">Logout ({{ current_user.username }})</button>
    </form>
    {% endif %}
  </nav>

  <div class="card">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <p class="flash">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
